# Development settings. Docker Compose loads this file automatically
# on top of docker-compose.yml when you run `docker compose up`.
#
# To run WITHOUT dev mode (like production):
#   docker compose -f docker-compose.yml up -d --build

services:
  backend:
    # Restart the server automatically whenever a file changes
    command: npm run dev
    volumes:
      # Share the whole backend folder with the container (live edits,
      # and `npm install` inside the container updates package.json here)
      - ./backend:/app
      # ...but keep node_modules INSIDE the container, built with the
      # container's Node version. Your machine's node_modules is never used.
      - /app/node_modules
